[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-agent"
version = "0.1.0"
description = "An agentic operations platform for coordinating enterprise workflows, tools, services, and human decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1,<0.164",
    "openai>=3.19.0",
    "pydantic>=2.13.4,<3.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0,<0.55",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=9.2.0",
]
