[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supportops-agent"
version = "0.1.0"
description = "An agentic operations platform for coordinating enterprise workflows, tools, services, and human decisions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.19.0",
    "pydantic>=2.13.4,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]